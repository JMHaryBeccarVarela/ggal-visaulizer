# Netlify — Front (Vite build estático)
# Deploy: Add new site → Import from Git → elegí este repo.
# Netlify lee este archivo. La URL del server (VITE_API_BASE) está acá abajo.

[build]
  base = "client"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # URL del server en Render. Pisa la variable VITE_API_BASE del panel de Netlify.
  VITE_API_BASE = "https://ggal-visaulizer.onrender.com"

# SPA de una sola página: cualquier ruta sirve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
